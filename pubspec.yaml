name: daily_habit_checker
description: "A clean and modern Material 3 Daily Habit Checker Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & Local Persistence
  shared_preferences: ^2.3.2

  # Date Formatting & Internationalization
  intl: ^0.19.0

  # Local Notifications & Alarms
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Google AdMob Monetization
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
